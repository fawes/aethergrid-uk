[project]
name = "aethergrid-uk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaleem Khan", email = "itsaksquare@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pyiceberg-core>=0.11.0",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12.0",
    "requests>=2.34.2",
    "xarray>=2026.9.0",
]

[project.scripts]
aethergrid-uk = "aethergrid_uk:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
